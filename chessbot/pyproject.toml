[project]
name = "chessbot"
version = "0.1.0"
description = "Neural chess engine: engine distillation (SL) -> MCTS -> RL fine-tuning"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "chess>=1.10", "numpy", "zstandard"]

[tool.setuptools]
packages = ["chessbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
